664" y="176" width="6" height="9"/> <rect x="675" y="176" width="6" height="9"/> <rect x="701" y="185" width="6" height="9"/> <rect x="738" y="180" width="7" height="10"/> </g> <!-- Mar del Norte / Atlántico --> <rect y="225" width="800" height="135" fill="url(#marEur)"/> <!-- Crucero navegando --> <g transform="translate(210, 152) scale(0.95)"> <polygon points="142,16 168,16 174,40 136,40" fill="#f59e0b"/> <rect x="140" y="12" width="28" height="5" fill="#0f172a"/> <polygon points="60,40 250,40 268,58 46,58" fill="#f8fafc"/> <polygon points="36,58 278,58 298,76 24,76" fill="#ffffff"/> <polygon points="10,76 325,76 300,102 24,102" fill="#1e293b"/> <rect x="18" y="83" width="298" height="5" fill="#38bdf8"/> </g> <!-- Olas --> <path d="M0 266 Q85 256 170 266 T340 266 T510 266 T680 266 T800 266" fill="none" stroke="#94a3b8" stroke-width="3" opacity="0.5"/> <path d="M0 300 Q105 288 210 300 T420 300 T630 300 T800 300" fill="none" stroke="#64748b" stroke-width="2.5" opacity="0.4"/> <!-- Etiqueta --> <rect x="26" y="24" width="225" height="36" rx="18" fill="#0f172a" opacity="0.78"/> <text x="138" y="47" font-family="Georgia, serif" font-size="15" fill="#ffffff" text-anchor="middle" letter-spacing="1">EUROPA OCCIDENTAL</text> </svg>